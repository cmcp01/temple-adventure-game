<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MY FIRST  GAME</title>
<style>
	html, body {
		margin: 0;
		padding: 0;
		border: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #000;
		touch-action: none;
		-webkit-user-select: none;
		user-select: none;
		-webkit-tap-highlight-color: transparent;
	}

	/* 游戏舞台：桌面 = 铺满窗口；手机竖屏 = 以横屏尺寸布局后整体旋转 90° */
	#stage {
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		transform-origin: 0 0;
		background: #000;
		overflow: hidden;
	}

	#game {
		display: block;
		width: 100%;
		height: 100%;
		border: 0;
		background: #000;
	}
</style>
</head>
<body>
	<div id="stage">
		<iframe id="game" src="game.html" allow="fullscreen; autoplay; gamepad"
			allowfullscreen frameborder="0" scrolling="no"></iframe>
	</div>

	<script>
	(function () {
		'use strict';

		var stage = document.getElementById('stage');
		var frame = document.getElementById('game');

		function isTouchDevice() {
			return (navigator.maxTouchPoints || 0) > 0
				|| 'ontouchstart' in window
				|| (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
		}

		function screenSize() {
			var vv = window.visualViewport;
			var w = (vv && vv.width) ? vv.width : 0;
			var h = (vv && vv.height) ? vv.height : 0;
			if (!w || !h) {
				w = window.innerWidth || document.documentElement.clientWidth || 0;
				h = window.innerHeight || document.documentElement.clientHeight || 0;
			}
			return { w: w, h: h };
		}

		var rotated = false;

		function layout() {
			var s = screenSize();
			if (!s.w || !s.h) { return; }

			// 手机竖屏握持时：舞台按横屏尺寸（高×宽）布局，再顺时针旋转 90° 铺满竖屏
			var wantRotate = isTouchDevice() && s.h > s.w + 1;

			if (wantRotate) {
				stage.style.width = s.h + 'px';
				stage.style.height = s.w + 'px';
				stage.style.transform = 'translate(' + s.w + 'px, 0px) rotate(90deg)';
				rotated = true;
			} else {
				stage.style.width = s.w + 'px';
				stage.style.height = s.h + 'px';
				stage.style.transform = 'none';
				rotated = false;
			}
		}

		var pending = null;
		function schedule() {
			if (pending) { return; }
			pending = setTimeout(function () { pending = null; layout(); }, 60);
		}

		window.addEventListener('resize', schedule);
		window.addEventListener('orientationchange', schedule);
		window.addEventListener('pageshow', schedule);
		document.addEventListener('visibilitychange', schedule);
		if (window.visualViewport && window.visualViewport.addEventListener) {
			window.visualViewport.addEventListener('resize', schedule);
			window.visualViewport.addEventListener('scroll', schedule);
		}
		// 微信 WebView 可能不派发事件，低频兜底（无事件时也能纠正布局）
		setInterval(function () {
			if (document.visibilityState === 'visible') { layout(); }
		}, 800);

		// 把焦点交给内嵌游戏，保证电脑端键盘与手机触摸都能直接作用到游戏
		function focusGame() {
			try { frame.focus(); } catch (e) { /* ignore */ }
		}
		window.addEventListener('pointerdown', focusGame, true);
		window.addEventListener('touchstart', focusGame, true);
		frame.addEventListener('load', focusGame);

		layout();
	}());
	</script>
</body>
</html>
